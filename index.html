<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>A'ini ERP — Stock Opname Petugas</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<meta name="theme-color" content="#2F6FED" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="A'ini Petugas" />
<style>
  :root{
    --primary:#2F6FED; --primary-hover:#1E5BDB; --primary-tint:#EAF1FE;
    --success:#22C55E; --success-tint:#EAFBF1;
    --warning:#F59E0B; --warning-tint:#FEF6E7;
    --info:#3B82F6; --info-tint:#EAF1FE;
    --danger:#EF4444; --danger-tint:#FDEDED;
    --gray-900:#111827; --gray-700:#374151; --gray-500:#6B7280; --gray-300:#D1D5DB;
    --border:#E5E7EB; --bg:#F6F7FB; --card:#FFFFFF;
    --radius:14px; --radius-lg:18px;
  }
  *{box-sizing:border-box;}
  button,.card-clickable,.produk-item,.chip,.scan-btn,.stepper button,.toggle,.ic-btn{transition:background .12s ease,transform .1s ease,border-color .12s ease;}
  button:active,.card-clickable:active,.produk-item:active,.chip:active,.scan-btn:active,.stepper button:active,.ic-btn:active{transform:scale(0.96);}
  .tap-flash{transform:scale(0.96) !important;}
  .card-clickable.tap-flash{background:#EAF1FE !important;}
  .produk-item.tap-flash{background:#EEF3FF !important;}
  .chip.tap-flash{background:#DCE7FB !important;}
  .ic-btn.tap-flash,.scan-btn.tap-flash,.stepper.tap-flash button.tap-flash{background:#E5E9F0 !important;}
  .btn-primary.tap-flash{background:var(--primary-hover) !important;}
  .btn-outline.tap-flash{background:#F3F4F6 !important;}
  html,body{margin:0;padding:0;background:#EEF0F4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--gray-900);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  #shell{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
  .statusbar{height:14px;}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  .topbar .ic-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:16px;color:var(--gray-700);}
  .topbar .ic-btn:active{background:#F3F4F6;}
  .topbar h1{font-size:16px;font-weight:700;margin:0;flex:1;}
  .content{flex:1;padding:16px;padding-bottom:100px;overflow-y:auto;}
  .center-content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 24px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;}
  .card-clickable{transition:background .1s,transform .1s;}
  .card-clickable:active{background:#EAF1FE;}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;}
  .row .lbl{color:var(--gray-500);}
  .row .val{color:var(--gray-900);font-weight:600;text-align:right;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .badge.warning{background:var(--warning-tint);color:#B45309;}
  .badge.info{background:var(--info-tint);color:#1D4ED8;}
  .badge.success{background:var(--success-tint);color:#15803D;}
  .badge.neutral{background:#F3F4F6;color:var(--gray-700);}
  .badge.danger{background:var(--danger-tint);color:#B91C1C;}

  .btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-hover);}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--gray-700);}
  .btn-danger-outline{background:#fff;border:1.5px solid #FCA5A5;color:var(--danger);}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
  .field input[type=text],.field input[type=password],.field input[type=date],.field textarea,.field select{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:#fff;color:var(--gray-900);
  }
  .field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);}
  .pw-wrap{position:relative;}
  .pw-wrap .toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--gray-500);font-size:13px;background:none;border:none;}
  .checkbox-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:22px;}
  .checkbox-row label{display:flex;align-items:center;gap:7px;color:var(--gray-700);}
  .checkbox-row a{color:var(--primary);text-decoration:none;font-weight:600;}

  .info-box{display:flex;gap:10px;background:var(--info-tint);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#1D4ED8;line-height:1.5;}
  .info-box.success{background:var(--success-tint);color:#15803D;}
  .info-box b{display:block;margin-bottom:2px;font-size:13px;}
  .info-box ul{margin:4px 0 0;padding-left:16px;}

  .logo-wrap{text-align:center;margin-bottom:28px;}
  .logo-wrap .mark{font-size:26px;font-weight:800;color:var(--gray-900);}
  .logo-wrap .sub{color:var(--gray-500);font-size:13px;margin-top:14px;}
  .logo-wrap h2{font-size:19px;margin:2px 0 0;}

  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden;background:linear-gradient(180deg,#EAF0F8 0%,#DCE6F2 100%);}
  .login-shell .shelf-bg{position:absolute;inset:0;opacity:.55;filter:blur(4px);z-index:0;}
  .login-shell .shelf-bg .col{position:absolute;top:0;bottom:0;width:30%;}
  .login-shell .shelf-bg .col.l{left:-4%;}
  .login-shell .shelf-bg .col.r{right:-4%;}
  .login-shell .shelf-bg .beam{position:absolute;left:8%;right:8%;height:6px;background:#8FA3C4;}
  .login-shell .shelf-bg .post{position:absolute;top:0;bottom:0;width:6px;background:#7A90B8;}
  .login-shell .shelf-bg .box{position:absolute;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .login-card{background:#fff;border-radius:26px;padding:34px 26px 26px;position:relative;z-index:1;width:100%;max-width:360px;box-shadow:0 30px 70px rgba(10,25,65,.28);}
  .login-icon{width:98px;height:98px;margin:0 auto 14px;position:relative;}
  .login-title{text-align:center;font-size:21px;font-weight:800;letter-spacing:.5px;color:var(--gray-900);}
  .login-subtitle{text-align:center;font-size:13px;color:var(--gray-500);margin-top:2px;}
  .login-divider{width:46px;height:3px;background:var(--primary);border-radius:99px;margin:14px auto 18px;opacity:.35;}
  .login-welcome{text-align:center;font-size:19px;font-weight:800;color:var(--gray-900);margin-bottom:4px;}
  .login-welcome-sub{text-align:center;font-size:12.5px;color:var(--gray-500);margin-bottom:22px;}
  .field-icon{position:relative;}
  .field-icon .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-500);display:flex;}
  .field-icon .ic svg{display:block;}
  .field-icon input{padding-left:40px !important;}
  .field input[type=text]:focus,.field input[type=password]:focus{box-shadow:0 0 0 3px var(--primary-tint);}
  .toggle svg{display:block;}
  .btn-gradient{background:linear-gradient(90deg,#1A3A8F 0%,#2F6FED 100%) !important;}
  .login-footer{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;font-size:11.5px;color:var(--gray-500);}
  .login-footer svg{display:block;}

  .progress-wrap{margin-bottom:14px;}
  .progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-500);margin-bottom:6px;}
  .progress-track{height:8px;background:#E5E7EB;border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .25s;}
  .stat-row{display:flex;gap:8px;margin:12px 0 14px;}
  .stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
  .stat .n{font-size:17px;font-weight:800;}
  .stat .l{font-size:10.5px;color:var(--gray-500);margin-top:2px;}

  .chip-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--gray-700);cursor:pointer;white-space:nowrap;}
  .chip:active{background:#F3F4F6;border-color:var(--gray-300);}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px;}
  .search-box input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;}
  .search-box .ic{color:var(--gray-500);font-size:15px;}

  .produk-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;}
  .produk-item:active{background:#EEF3FF;}
  .produk-item .thumb{width:42px;height:42px;border-radius:10px;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;}
  .produk-item .thumb.done{background:var(--success-tint);}
  .produk-item .info{flex:1;min-width:0;}
  .produk-item .nama{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .produk-item .meta{font-size:11.5px;color:var(--gray-500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .produk-item .right{text-align:right;flex:0 0 auto;}
  .produk-item .right .sf{font-size:13px;font-weight:700;}
  .produk-item .right .sf-label{font-size:10px;color:var(--gray-500);}
  .produk-item .chev{color:var(--gray-300);font-size:16px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--gray-500);font-size:13px;}

  .stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 4px;}
  .stepper button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:22px;font-weight:700;color:var(--gray-700);cursor:pointer;}
  .stepper button:active{background:#F3F4F6;}
  .stepper input{width:90px;text-align:center;font-size:24px;font-weight:800;border:none;background:transparent;}
  .selisih{text-align:center;font-size:13px;font-weight:700;margin-bottom:6px;}
  .selisih.neg{color:var(--danger);}
  .selisih.pos{color:var(--success);}
  .selisih.zero{color:var(--gray-500);}
  .char-count{text-align:right;font-size:11px;color:var(--gray-500);margin-top:4px;}

  .footer-fixed{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;max-width:420px;margin:0 auto;width:100%;}

  .center-icon{width:84px;height:84px;border-radius:50%;background:var(--success-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:40px;color:var(--success);}
  .center-icon.blue{background:var(--info-tint);color:var(--info);}
  .center-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:6px;}
  .center-sub{text-align:center;font-size:13px;color:var(--gray-500);margin-bottom:22px;line-height:1.5;padding:0 6px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:50;max-width:340px;text-align:center;}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-text{color:var(--danger);font-size:12.5px;margin:-8px 0 14px;}
  a{color:inherit;}

  .search-box .scan-btn{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:var(--gray-700);}
  .search-box .scan-btn:active{background:#F3F4F6;}

  #scan-shell{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;max-width:420px;margin:0 auto;}
  #scan-video{flex:1;width:100%;height:100%;object-fit:cover;background:#000;}
  .scan-topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px 16px;z-index:2;}
  .scan-topbar .ic-btn{width:34px;height:34px;border-radius:10px;border:none;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
  .scan-topbar h1{color:#fff;font-size:15px;font-weight:700;margin:0;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78%;max-width:300px;aspect-ratio:5/3;border:2.5px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
  .scan-hint{position:absolute;left:0;right:0;bottom:110px;text-align:center;color:#fff;font-size:12.5px;padding:0 30px;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .scan-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;color:#fff;z-index:3;background:rgba(17,24,39,.92);}
  .scan-state .ic{font-size:34px;}
</style>
</head>
<body ontouchstart="">
<div id="shell"></div>

<!-- Scan Barcode kamera: ZXing (decode Code128/EAN/dll dari video stream). CDN, app ini
     berdiri sendiri (bukan bagian repo GAS), pola sama JsBarcode CDN di Index.html repo utama. -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script>
/* =========================================================================
 * A'ini ERP — Mobile Stock Opname (Petugas)
 * App TERPISAH (di luar repo GAS utama, keputusan Product Owner 29 Juli 2026).
 * Konsumsi backend lewat doPost whitelist (Code.js), BUKAN google.script.run
 * (itu cuma jalan di dalam HTML Service GAS sendiri) - lihat SYNC_ACTIONS baru:
 * apiLogin / apiListStockOpnameUntukPetugas / apiGetStockOpnameDetailUntukPetugas /
 * apiInputStokFisikPetugas / apiSelesaikanOpnamePetugas.
 *
 * Modul Penerimaan Barang (baru) butuh whitelist action tambahan di backend:
 * apiListPenerimaanBarang(token) -> [{Id,NomorPenerimaan,Supplier,NoNota,Tanggal,
 *   Status,TotalQty,TotalNilai}]
 * apiBuatPenerimaanBarang(token,supplier,noNota,tanggal,catatan) -> header baru
 *   (status Draft, Items:[])
 * apiGetPenerimaanDetail(token,penerimaanId) -> header + Items, buat resume draft
 * apiCariProdukBarcode(token,barcode) -> produk {ProdukId,Nama,Barcode,HargaBeli}
 *   atau null kalau belum terdaftar
 * apiBuatProdukBaru(token,barcode,nama,kategori,hargaBeli) -> produk baru
 * apiSimpanItemPenerimaan(token,penerimaanId,produkId,qty) -> Items terbaru
 *   (insert kalau produk belum ada di daftar, replace qty kalau sudah)
 * apiSelesaikanPenerimaanBarang(token,penerimaanId) -> header final (Status Selesai)
 * Backend belum tersedia di sesi ini - frontend di bawah sudah siap pakai
 * kontrak ini, tinggal disambungkan begitu action di Code.js dibuat.
 *
 * Scope sengaja ONLINE-ONLY (keputusan PO): setiap aksi langsung fetch() ke server,
 * TIDAK ada local store/offline queue/sync engine di app ini - beda dari POS Offline-
 * First (TDD_Offline_First_POS). Badge/istilah "tersimpan di server" dipakai apa
 * adanya, bukan "di perangkat" (supaya tidak mengklaim kemampuan yang belum dibangun).
 * ========================================================================= */

// GANTI dengan URL deployment GAS (`/exec`) proyek utama sebelum dipakai produksi.
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxlyManslLRkZdiuxkHGcQCJa3Efpgqc_Zn1vFfdPqtmkzRFOvoby8hcGOB4LfHQjGK/exec';

const state = {
  token: null,
  user: null,
  view: 'login',
  loading: false,
  error: '',
  showPw: false,
  sesiList: [],
  sesi: null,        // header + Items + progress, sesi yang sedang dibuka
  listOrigin: 'mulai', // 'mulai' | 'edit' - dari menu mana Detail Sesi dibuka, dipakai tombol back
  filter: 'SEMUA',    // SEMUA | SUDAH | BELUM
  search: '',
  selisihFilter: 'SEMUA', // SEMUA | MINUS | PLUS (Daftar Selisih)
  selisihItem: null,       // item aktif di layar Edit Selisih / Riwayat Edit
  stokKoreksiInput: 0,
  catatanKoreksiInput: '',
  lastSync: null,          // Date terakhir Sinkron Sekarang berhasil
  toastMsg: '',
  activeItem: null,   // item Produk yang sedang diinput di layar Input Stok Fisik
  stokFisikInput: 0,
  catatanInput: '',
  scanState: 'starting', // starting | live | denied | notfound
  scanNotFoundBarcode: '',

  // ---- Penerimaan Barang -------------------------------------------------
  penerimaanList: [],
  penerimaanFilter: 'SEMUA', // SEMUA | DRAFT | SELESAI
  penerimaan: null,          // header + Items, penerimaan yang sedang dikerjakan
  produkPenerimaanAktif: null, // produk yang lagi diisi qty-nya
  qtyPenerimaanInput: 0,
  barcodeBaru: '',           // barcode hasil scan yang belum terdaftar di produk

  // ---- Pengantaran Online -------------------------------------------------
  // Data pesanan dari Sheet_PesananOnline (PesananOnlineController/Service.js) - dibuat
  // customer/kasir POS, di sini Petugas cuma MENGERJAKAN (DIPROSES->DIANTAR->SELESAI),
  // bukan bikin baru. TIDAK ada state lokal/localStorage - selalu dari server.
  pengantaranList: [],
  pengantaranFilter: 'SEMUA', // SEMUA | DIPROSES | DIANTAR | SELESAI
  pengantaranAktif: null,     // pesanan yang sedang dibuka di layar Detail
  fotoBuktiPengantaran: ''    // data URL foto bukti (layar Selesaikan Pengantaran)
};

// ---- Scan Barcode kamera (ZXing) -----------------------------------------
// Video/reader hidup DI LUAR render() (bukan bagian VIEWS) supaya tidak ikut
// dibongkar-pasang tiap render() lain berjalan - overlay #scan-shell disuntik
// manual ke <body>, terpisah dari innerHTML shell utama.
let zxingReader = null;
let zxingStream = null;

function bukaScan() {
  state.scanState = 'starting';
  state.scanNotFoundBarcode = '';
  renderScanOverlay();
  startScanner();
}

function tutupScan() {
  stopScanner();
  const el = document.getElementById('scan-shell');
  if (el) el.remove();
}

function renderScanOverlay() {
  let existing = document.getElementById('scan-shell');
  if (!existing) {
    existing = document.createElement('div');
    existing.id = 'scan-shell';
    document.body.appendChild(existing);
  }
  let overlayHtml = '';
  if (state.scanState === 'denied') {
    overlayHtml = '<div class="scan-state">' +
      '<div class="ic">🚫</div>' +
      '<div style="font-weight:700;font-size:15px;">Kamera tidak dapat diakses</div>' +
      '<div style="font-size:12.5px;color:#D1D5DB;">Izinkan akses kamera di pengaturan browser, atau cari produk lewat nama.</div>' +
      '<div class="btn-row" style="width:100%;margin-top:6px;">' +
        '<button class="btn btn-outline" data-act="scan-tutup">Ketik Manual</button>' +
        '<button class="btn btn-primary" data-act="scan-coba-lagi">Coba Lagi</button>' +
      '</div>' +
    '</div>';
  } else if (state.scanState === 'notfound') {
    overlayHtml = '<div class="scan-state">' +
      '<div class="ic">❓</div>' +
      '<div style="font-weight:700;font-size:15px;">Barcode tidak ditemukan</div>' +
      '<div style="font-size:12.5px;color:#D1D5DB;">"' + esc(state.scanNotFoundBarcode) + '" tidak ada di daftar produk sesi ini.</div>' +
      '<div class="btn-row" style="width:100%;margin-top:6px;">' +
        '<button class="btn btn-outline" data-act="scan-tutup">Tutup</button>' +
        '<button class="btn btn-primary" data-act="scan-coba-lagi">Scan Lagi</button>' +
      '</div>' +
    '</div>';
  }
  existing.innerHTML =
    '<div class="scan-topbar"><button class="ic-btn" data-act="scan-tutup">←</button><h1>Scan Barcode Produk</h1><div style="width:34px;"></div></div>' +
    '<video id="scan-video" autoplay muted playsinline></video>' +
    (state.scanState === 'live' ? '<div class="scan-frame"></div><div class="scan-hint">Arahkan kamera ke barcode produk</div>' : '') +
    overlayHtml;
  existing.querySelectorAll('[data-act]').forEach(function (el) {
    el.addEventListener('click', function () { handleAction(el.getAttribute('data-act'), el); });
  });
}

async function startScanner() {
  if (!window.ZXing) {
    state.scanState = 'denied';
    renderScanOverlay();
    return;
  }
  try {
    zxingReader = new ZXing.BrowserMultiFormatReader();
    const devices = await zxingReader.listVideoInputDevices();
    const backCam = devices.find(function (d) { return /back|rear|environment/i.test(d.label); });
    const deviceId = backCam ? backCam.deviceId : (devices[0] ? devices[0].deviceId : undefined);
    state.scanState = 'live';
    renderScanOverlay();
    zxingReader.decodeFromVideoDevice(deviceId, 'scan-video', function (result, err) {
      if (result) onBarcodeDetected(result.getText());
    });
  } catch (e) {
    state.scanState = 'denied';
    renderScanOverlay();
  }
}

function stopScanner() {
  if (zxingReader) {
    try { zxingReader.reset(); } catch (e) {}
    zxingReader = null;
  }
  if (zxingStream) {
    zxingStream.getTracks().forEach(function (t) { t.stop(); });
    zxingStream = null;
  }
}

function onBarcodeDetected(barcode) {
  if (state.view === 'penerimaan-scan') {
    stopScanner();
    tutupScan();
    cariProdukPenerimaan(barcode);
    return;
  }
  if (!state.sesi) return;
  if (state.view === 'selisih-list') {
    const item = state.sesi.Items.filter(function (i) {
      return String(i.Barcode || '') === String(barcode) && hitungSelisih(i) !== 0;
    })[0];
    if (item) {
      stopScanner();
      tutupScan();
      bukaEditSelisih(item);
    } else {
      state.scanState = 'notfound';
      state.scanNotFoundBarcode = barcode;
      stopScanner();
      renderScanOverlay();
    }
    return;
  }
  const item = state.sesi.Items.filter(function (i) { return String(i.Barcode || '') === String(barcode); })[0];
  if (item) {
    stopScanner();
    tutupScan();
    bukaInputStok(item);
  } else {
    // Barcode kebaca tapi bukan produk di sesi ini - kamera dihentikan dulu (supaya
    // tidak spam deteksi barcode yang sama berulang-ulang tiap frame), tampilkan pesan,
    // Petugas pilih "Scan Lagi" (nyalakan ulang) atau "Tutup" (balik cari manual).
    state.scanState = 'notfound';
    state.scanNotFoundBarcode = barcode;
    stopScanner();
    renderScanOverlay();
  }
}

// ---- API helper --------------------------------------------------------
async function api(action, params) {
  const controller = new AbortController();
  const timeoutId = setTimeout(function () { controller.abort(); }, 25000); // 25 detik batas tunggu
  let res;
  try {
    res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight OPTIONS (GAS doPost tidak menangani preflight)
      body: JSON.stringify({ action: action, params: params || {} }),
      signal: controller.signal
    });
  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error('Server tidak merespon (timeout 25 detik). Coba lagi, atau cek status server.');
    }
    throw new Error('Gagal terhubung ke server. Cek koneksi internet kamu.');
  } finally {
    clearTimeout(timeoutId);
  }
  let json;
  try {
    json = await res.json();
  } catch (e) {
    throw new Error('Server mengembalikan respon tidak valid (bukan JSON). Cek Executions di Apps Script.');
  }
  if (!json.success) throw new Error(json.message || 'Terjadi kesalahan pada server.');
  return json.data;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtTanggal(d) {
  if (!d) return '-';
  const dt = new Date(d);
  const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return dt.getDate() + ' ' + bulan[dt.getMonth()] + ' ' + dt.getFullYear();
}
function fmtWaktu(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return fmtTanggal(d) + ' ' + String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
}

function hitungSelisih(item) { return Number(item.StokFisik) - Number(item.StokSistem); }

// Helper aman buat nampilin RakDipilih - backend kadang balikin array, kadang
// string (comma-separated) tergantung endpoint. Jangan asumsi array, biar
// gak lempar "X.join is not a function" dan bikin render macet/spinner nyangkut.
function fmtRak(r) {
  if (Array.isArray(r)) return r.join(', ');
  return r == null || r === '' ? '-' : String(r);
}

// EditCount di sini PER PRODUK (RiwayatEdit per item dari server), beda level

async function guarded(fn) {
  state.error = '';
  state.loading = true; render();
  try {
    await fn();
  } catch (e) {
    state.error = e.message || 'Terjadi kesalahan.';
  } finally {
    state.loading = false; render();
  }
}

// ---- Persist sesi login & halaman terakhir (localStorage) ---------------
// Supaya app tidak balik ke halaman Login tiap kali di-refresh atau dibuka
// ulang - token, user, dan halaman terakhir disimpan di localStorage lalu
// dipulihkan saat app dimuat (lihat initApp()).
const SESSION_KEY = 'soPetugasSession';

function simpanSesiTerakhir() {
  if (!state.token) return;
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      token: state.token,
      user: state.user,
      view: state.view,
      sesiId: state.sesi ? state.sesi.Id : null,
      listOrigin: state.listOrigin
    }));
  } catch (e) { /* localStorage tidak tersedia - abaikan, cukup fallback ke login */ }
}

function hapusSesiTersimpan() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function bacaSesiTersimpan() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// ---- Penerimaan yang disembunyikan dari tampilan (hapus lokal saja, TIDAK
// menghapus data di server - hanya disembunyikan di HP ini). Disimpan di
// localStorage supaya tetap hilang walau app di-refresh/dibuka ulang.
const HIDDEN_PENERIMAAN_KEY = 'soPetugasPenerimaanHidden';

function bacaPenerimaanTersembunyi() {
  try {
    const raw = localStorage.getItem(HIDDEN_PENERIMAAN_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function sembunyikanPenerimaan(id) {
  try {
    const hidden = bacaPenerimaanTersembunyi();
    if (hidden.indexOf(String(id)) === -1) hidden.push(String(id));
    localStorage.setItem(HIDDEN_PENERIMAAN_KEY, JSON.stringify(hidden));
  } catch (e) { /* localStorage tidak tersedia - abaikan */ }
}

function goto(view) {
  // Jaring pengaman: kalau overlay scan masih terbuka saat navigasi lain terjadi,
  // pastikan kamera dimatikan (tidak boleh ada stream kamera nyala di background).
  const scanEl = document.getElementById('scan-shell');
  if (scanEl) { stopScanner(); scanEl.remove(); }
  state.view = view; state.error = ''; render();
  simpanSesiTerakhir();
}

    goto('selisih-list');
    const selBaru = Number(updated.StokFisik) - Number(updated.StokSistem);
    showToast('Tersimpan. Sistem ' + updated.StokSistem + ', Selisih ' + (selBaru > 0 ? '+' : '') + selBaru + '.');
  });
}

function showToast(msg) {
  state.toastMsg = msg;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { state.toastMsg = ''; render(); }, 2400);
}

function bukaInputStok(item) {
  state.activeItem = item;
  state.stokFisikInput = 0;
  state.catatanInput = item.CatatanPetugas || '';
  state.focusStokFisik = true;
  goto('input');
}

function simpanStokFisik() {
  const item = state.activeItem;
  const qty = state.stokFisikInput;
  const catatan = state.catatanInput;

  // OPTIMASI UTAMA: dulu nunggu balesan server (backend GAS, bisa 1-3 detik) BARU pindah
  // layar - ini penyebab utama alur kerasa "lelet". Sekarang: update state lokal INSTAN,
  // langsung lompat ke produk berikutnya, simpan ke server jalan di BACKGROUND tanpa
  // nge-block tampilan sama sekali.
  item.Dihitung = true;
  item.StokFisik = qty;
  item.CatatanPetugas = catatan;
  recomputeProgress();

  const next = state.sesi.Items.filter(function (d) { return d.Dihitung !== true; })[0];
  if (next) {
    state.toastMsg = 'Tersimpan. Lanjut produk berikutnya.';
    bukaInputStok(next);
  } else {
    state.toastMsg = 'Tersimpan. Semua produk sudah dihitung ✓';
    goto('proses');
  }

  api('apiInputStokFisikPetugas', {
    token: state.token,
    stockOpnameId: state.sesi.Id,
    produkId: item.ProdukId,
    stokFisik: qty,
    catatan: catatan
  }).then(function (items) {
    state.sesi.Items = items; // sinkron ulang dari server begitu selesai
    recomputeProgress();
    render();
  }).catch(function (e) {
    // Gagal sync ke server - balikin status jadi belum dihitung biar KEDATA, jangan diam-diam
    // ilang. Petugas dikasih tau via toast, tapi alur kerja tetap gak ke-block.
    item.Dihitung = false;
    recomputeProgress();
    state.toastMsg = 'Gagal sinkron "' + item.Nama + '": ' + e.message + '. Coba input ulang.';
    render();
  });
}

function recomputeProgress() {
  const items = state.sesi.Items;
  const sudah = items.filter(function (d) { return d.Dihitung === true; }).length;
  state.sesi.totalProduk = items.length;
  state.sesi.sudahDihitung = sudah;
  state.sesi.belumDihitung = items.length - sudah;
  state.sesi.statusLabel = sudah === items.length ? state.sesi.statusLabel : state.sesi.statusLabel;
}

function selesaikanOpname() {
  guarded(async function () {
    const updated = await api('apiSelesaikanOpnamePetugas', { token: state.token, stockOpnameId: state.sesi.Id });
    // Jangan biarin field RakDipilih dari response nimpa kalau bentuknya beda
    // (server kadang balikin string, bukan array) - pertahanin array asli.
    if (updated && !Array.isArray(updated.RakDipilih)) delete updated.RakDipilih;
    state.sesi = Object.assign({}, state.sesi, updated, { statusLabel: 'MENUNGGU_REVIEW' });
    goto('selesai');
  });
}

// ---- Views -----------------------------------------------------------
function render() {
  const shell = document.getElementById('shell');
  let html = '<div class="statusbar"></div>';
  html += VIEWS[state.view] ? VIEWS[state.view]() : '';
  if (state.error) {
    html = html.replace('__ERROR__', '<div class="err-text">' + esc(state.error) + '</div>');
  } else {
    html = html.replace('__ERROR__', '');
  }
  shell.innerHTML = html;
  bindEvents();
  if (state.toastMsg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = state.toastMsg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2300);
  }
}

function bindEvents() {
  document.querySelectorAll('[data-act]').forEach(function (el) {
    el.addEventListener('click', function () {
      // PERBAIKAN: sebelum ini gak ada guard sama sekali - tombol "Ya, Selesaikan"/"Simpan"/
      // dll pas loading cuma ganti teks jadi spinner, TAPI TETAP BISA DIKLIK LAGI. User yang
      // gak sabar nunggu (request ke GAS Web App emang bisa 1-3 detik) jadi numpuk banyak klik,
      // tiap klik ngirim request BARU ke server bareng-bareng - saling antre, berasa "macet"
      // lama banget. Guard ini nolak SEMUA klik data-act selama masih ada request jalan.
      if (state.loading) return;
      const act = el.getAttribute('data-act');
      // PERBAIKAN: stepper +/- + alur inti hitung (buka produk, simpan, lanjut) dipencet
      // berkali-kali/berturut-turut - jeda 110ms bikin lelet. Screen udah ganti = feedback-nya
      // sendiri, gak butuh flash tambahan. Cuma tombol navigasi jarang-pencet yang pake jeda.
      const isFastTap = (act === 'stepper-minus' || act === 'stepper-plus' ||
        act === 'selisih-stepper-minus' || act === 'selisih-stepper-plus' ||
        act === 'buka-input' || act === 'simpan-stok' || act === 'back-to-proses' ||
        act === 'qty-p-minus' || act === 'qty-p-plus');
      if (isFastTap) { handleAction(act, el); return; }
      // PERBAIKAN: klik/tap langsung render() ganti seluruh halaman - :active CSS udah
      // keburu hilang (kepencet cuma pas jari nempel) sebelum sempat kelihatan, jadi tap
      // berasa "kosong". Kasih jeda dikit + flash manual biar kerasa dulu, baru aksi jalan.
      el.classList.add('tap-flash');
      setTimeout(function () { handleAction(act, el); }, 110);
    });
  });
  const inSearch = document.getElementById('in-search');
  if (inSearch) inSearch.addEventListener('input', function (e) { state.search = e.target.value; render(); preserveFocus('in-search'); });
  const inCatatan = document.getElementById('in-catatan');
  if (inCatatan) inCatatan.addEventListener('input', function (e) { state.catatanInput = e.target.value.slice(0, 100); render(); preserveFocus('in-catatan'); });
  const inStok = document.getElementById('in-stokfisik');
  if (inStok) inStok.addEventListener('input', function (e) {
    const n = Number(e.target.value.replace(/[^0-9]/g, '')) || 0;
    state.stokFisikInput = n; render(); preserveFocus('in-stokfisik');
  });
  const inKoreksi = document.getElementById('in-stokkoreksi');
  if (inKoreksi) inKoreksi.addEventListener('input', function (e) {
    const n = Number(e.target.value.replace(/[^0-9]/g, '')) || 0;
    state.stokKoreksiInput = n; render(); preserveFocus('in-stokkoreksi');
  });
  const inQtyP = document.getElementById('in-qtypenerimaan');
  if (inQtyP) inQtyP.addEventListener('input', function (e) {
    const n = Number(e.target.value.replace(/[^0-9]/g, '')) || 0;
    state.qtyPenerimaanInput = n; render(); preserveFocus('in-qtypenerimaan');
  });
  const inHargaBaru = document.getElementById('in-pb-harga');
  if (inHargaBaru) inHargaBaru.addEventListener('input', function (e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });
  const inCatatanKoreksi = document.getElementById('in-catatankoreksi');
  if (inCatatanKoreksi) inCatatanKoreksi.addEventListener('input', function (e) { state.catatanKoreksiInput = e.target.value.slice(0, 200); render(); preserveFocus('in-catatankoreksi'); });
  // Foto bukti Selesaikan Pengantaran - dibaca jadi data URL (base64) di HP langsung,
  // dikirim sebagai fotoBase64 ke apiSelesaikanPengantaranOnline (PesananOnlineService.
  // _simpanFotoBukti upload ke Drive di server, bukan disimpan mentah di Sheet).
  const inFoto = document.getElementById('in-po-foto');
  if (inFoto) inFoto.addEventListener('change', function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () { state.fotoBuktiPengantaran = reader.result; state.error = ''; render(); };
    reader.readAsDataURL(file);
  });
  // OPTIMASI: auto-fokus + auto-select isi input stok fisik begitu layar dibuka,
  // petugas langsung ketik angka tanpa perlu tap ke field dulu - hemat 1 tap tiap produk.
  if (state.focusStokFisik) {
    state.focusStokFisik = false;
    const inpFocus = document.getElementById('in-stokfisik');
    if (inpFocus) { inpFocus.focus(); inpFocus.select(); }
  }
}
function preserveFocus(id) {
  const el = document.getElementById(id);
  if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; }
}

function handleAction(act, el) {
  if (act === 'toggle-pw') { state.showPw = !state.showPw; render(); return; }
  if (act === 'login') {
    const u = document.getElementById('in-username').value.trim();
    const p = document.getElementById('in-password').value;
    if (!u || !p) { state.error = 'Username dan password wajib diisi.'; render(); return; }
    doLogin(u, p); return;
  }
  if (act === 'logout') { state.token = null; state.user = null; hapusSesiTersimpan(); goto('login'); return; }
  if (act === 'goto-list-mulai') { state.listOrigin = 'mulai'; goto('list-mulai'); refreshSesiListSilent(); return; }
  if (act === 'goto-list-edit') { state.listOrigin = 'edit'; goto('list-edit'); refreshSesiListSilent(); return; }
  if (act === 'goto-penerimaan') { bukaPenerimaanList(); return; }
  if (act === 'goto-pengantaran') { bukaPengantaranList(); return; }
  if (act === 'back-to-pengantaran-list') { bukaPengantaranList(); return; }
  if (act === 'filter-pengantaran') { state.pengantaranFilter = el.getAttribute('data-f'); render(); return; }
  if (act === 'buka-pengantaran') { bukaPengantaran(el.getAttribute('data-id')); return; }
  if (act === 'mulai-pengantaran') { mulaiPengantaran(); return; }
  if (act === 'goto-pengantaran-selesai') { state.fotoBuktiPengantaran = ''; goto('pengantaran-online-selesai'); return; }
  if (act === 'back-to-pengantaran-detail') { goto('pengantaran-online-detail'); return; }
  if (act === 'submit-pengantaran-selesai') {
    const catatan = document.getElementById('in-po-catatan-selesai').value.trim();
    selesaikanPengantaran(catatan); return;
  }
  if (act === 'goto-penerimaan-buat') { goto('penerimaan-buat'); return; }
  if (act === 'back-to-penerimaan-list') { bukaPenerimaanList(); return; }
  if (act === 'filter-penerimaan') { state.penerimaanFilter = el.getAttribute('data-f'); render(); return; }
  if (act === 'mulai-penerimaan') { mulaiPenerimaanBaru(); return; }
  if (act === 'buka-penerimaan-draft') { bukaPenerimaanDraft(el.getAttribute('data-id')); return; }
  if (act === 'hapus-penerimaan') { hapusPenerimaan(el.getAttribute('data-id')); return; }
  if (act === 'back-to-penerimaan-scan') { state.produkPenerimaanAktif = null; state.barcodeBaru = ''; goto('penerimaan-scan'); return; }
  if (act === 'qty-p-minus' || act === 'qty-p-plus') {
    state.qtyPenerimaanInput = act === 'qty-p-plus' ? state.qtyPenerimaanInput + 1 : Math.max(1, state.qtyPenerimaanInput - 1);
    const inpQ = document.getElementById('in-qtypenerimaan');
    if (inpQ) inpQ.value = state.qtyPenerimaanInput; else render();
    return;
  }
  if (act === 'simpan-qty-penerimaan') { simpanQtyPenerimaan(); return; }
  if (act === 'simpan-produk-baru-penerimaan') {
    const nama = document.getElementById('in-pb-nama').value.trim();
    const kategori = document.getElementById('in-pb-kategori').value;
    const satuan = document.getElementById('in-pb-satuan').value;
    const harga = Number(document.getElementById('in-pb-harga').value.replace(/[^0-9]/g, '')) || 0;
    if (!nama || !satuan || !harga) { state.error = 'Nama produk, satuan, dan harga beli wajib diisi.'; render(); return; }
    submitProdukBaruPenerimaan(nama, kategori, satuan, harga); return;
  }
  if (act === 'goto-review-penerimaan') { goto('penerimaan-review'); return; }
  if (act === 'ya-selesaikan-penerimaan') { selesaikanPenerimaan(); return; }
  if (act === 'selesai-penerimaan-ke-daftar') { bukaPenerimaanList(); return; }
  if (act === 'back-to-home') { goto('home'); return; }
  if (act === 'open-sesi') { openSesi(el.getAttribute('data-id')); return; }
  if (act === 'back-to-list') { goto(state.listOrigin === 'edit' ? 'list-edit' : 'list-mulai'); refreshSesiListSilent(); return; }
  if (act === 'mulai-hitung') { mulaiHitung(); return; }
  if (act === 'back-to-detail') { openSesi(state.sesi.Id); return; }
  if (act === 'filter') { state.filter = el.getAttribute('data-f'); render(); return; }
  if (act === 'lihat-selisih') { lihatSelisih(); return; }
  if (act === 'selisih-filter') { state.selisihFilter = el.getAttribute('data-f'); render(); return; }
  if (act === 'buka-edit-selisih') {
    const item = state.sesi.Items.filter(function (i) { return String(i.ProdukId) === el.getAttribute('data-id'); })[0];
    bukaEditSelisih(item); return;
  }
  if (act === 'back-to-selisih-list') { goto('selisih-list'); return; }
  if (act === 'selisih-stepper-minus' || act === 'selisih-stepper-plus') {
    state.stokKoreksiInput = act === 'selisih-stepper-plus' ? state.stokKoreksiInput + 1 : Math.max(0, state.stokKoreksiInput - 1);
    // PERBAIKAN: dulu render() penuh tiap tap - berat & delay kalau dipencet cepat-cepat.
    // Sekarang update langsung ke elemen input-nya aja, instant, gak reflow seluruh halaman.
    const inpK = document.getElementById('in-stokkoreksi');
    if (inpK) inpK.value = state.stokKoreksiInput; else render();
    return;
  }
  if (act === 'simpan-koreksi-selisih') { simpanKoreksiSelisih(); return; }
  if (act === 'goto-riwayat-selisih') { goto('riwayat-selisih'); return; }
  if (act === 'back-to-selisih-edit') { goto('selisih-edit'); return; }
  if (act === 'goto-sinkron') { goto('sinkron'); return; }
  if (act === 'sinkron-sekarang') { sinkronSekarang(); return; }
  if (act === 'buka-scan') { bukaScan(); return; }
  if (act === 'scan-tutup') { tutupScan(); return; }
  if (act === 'scan-coba-lagi') { state.scanState = 'starting'; renderScanOverlay(); startScanner(); return; }
  if (act === 'buka-input') {
    const item = state.sesi.Items.filter(function (i) { return String(i.ProdukId) === el.getAttribute('data-id'); })[0];
    bukaInputStok(item); return;
  }
  if (act === 'stepper-minus' || act === 'stepper-plus') {
    state.stokFisikInput = act === 'stepper-plus' ? state.stokFisikInput + 1 : Math.max(0, state.stokFisikInput - 1);
    const inpS = document.getElementById('in-stokfisik');
    if (inpS) inpS.value = state.stokFisikInput; else render();
    return;
  }
  if (act === 'simpan-stok') { simpanStokFisik(); return; }
  if (act === 'back-to-proses') { goto('proses'); return; }
  if (act === 'goto-konfirmasi') { goto('konfirmasi'); return; }
  if (act === 'ya-selesaikan') { selesaikanOpname(); return; }
  if (act === 'selesai-ke-daftar') { state.listOrigin = 'mulai'; goto('list-mulai'); refreshSesiListSilent(); return; }
}

// ---- Bootstrap: pulihkan sesi login & halaman terakhir saat app dimuat --
// Dipanggil sekali saat app pertama kali dibuka/refresh. Kalau ada token
// tersimpan, coba pulihkan langsung ke halaman terakhir (bukan balik ke
// Login). Kalau token sudah kadaluarsa/invalid di server, otomatis fallback
// ke Login (tanpa nyangkut/nge-blank).
function initApp() {
  const saved = bacaSesiTersimpan();
  if (!saved || !saved.token) { render(); return; }

  state.token = saved.token;
  state.user = saved.user;
  state.listOrigin = saved.listOrigin || 'mulai';

  // Halaman yang cukup butuh data sesi (Items) untuk ditampilkan ulang -
  // aman dipulihkan langsung.
  const viewsBisaLangsung = ['detail', 'proses', 'selisih-list', 'sinkron', 'selesai'];
  // Halaman yang butuh state sesaat (item aktif yang sedang diinput/diedit) -
  // state itu tidak disimpan, jadi baliknya ke halaman induk yang terdekat.
  const fallbackView = {
    input: 'proses',
    konfirmasi: 'proses',
    'selisih-edit': 'selisih-list',
    'riwayat-selisih': 'selisih-list',
    'penerimaan-buat': 'penerimaan',
    'penerimaan-scan': 'penerimaan',
    'penerimaan-qty': 'penerimaan',
    'penerimaan-produk-baru': 'penerimaan',
    'penerimaan-review': 'penerimaan',
    'penerimaan-selesai': 'penerimaan',
    'pengantaran-online-detail': 'pengantaran-online',
    'pengantaran-online-selesai': 'pengantaran-online'
  };
  const viewsTanpaSesi = ['home', 'list-mulai', 'list-edit', 'penerimaan', 'pengantaran-online'];

  state.loading = true;
  render();

  (async function () {
    try {
      // Validasi token sekaligus ambil daftar sesi - kalau token sudah tidak
      // valid/kadaluarsa di server, api() akan melempar error (masuk ke catch).
      state.sesiList = await api('apiListStockOpnameUntukPetugas', { token: state.token });

      let targetView = fallbackView[saved.view] || saved.view;

      if (viewsBisaLangsung.indexOf(targetView) !== -1 && saved.sesiId) {
        try {
          state.sesi = await api('apiGetStockOpnameDetailUntukPetugas', { token: state.token, stockOpnameId: saved.sesiId });
        } catch (e) {
          targetView = 'home'; // sesi sudah tidak ada/berubah - aman balik ke Home
        }
      } else if (viewsTanpaSesi.indexOf(targetView) === -1) {
        targetView = 'home';
      }

      state.view = targetView;
      simpanSesiTerakhir();
      // Non-blocking, pola sama doLogin - badge "Pengantaran Online" Home nyusul.
      refreshPengantaranListSilent();
    } catch (e) {
      // Token sudah tidak valid/kadaluarsa di server - bersihkan sesi tersimpan
      // dan pastikan mendarat rapi di halaman Login tanpa pesan error nyangkut.
      state.token = null;
      state.user = null;
      state.sesi = null;
      hapusSesiTersimpan();
      state.view = 'login';
      state.error = '';
    } finally {
      state.loading = false;
      render();
    }
  })();
}

initApp();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('SW register gagal:', err);
    });
  });
}
</script>
